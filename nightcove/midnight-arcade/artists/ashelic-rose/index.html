<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#0a0004">
        <title>ASHELIC ROSE | Midnight Arcade</title>
        <link rel="stylesheet" href="ashelic-rose-music.css">
    </head>

    <body>

        <main class="sound-room">

            <div class="ambient-orbs" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            </div>

            <nav class="sound-nav">
            <a href="../../games.html">
                ← MIDNIGHT ARCADE
            </a>

            <span>
                TMN // ARTIST TRANSMISSION
            </span>
            </nav>

            <section class="artist-stage">

                <div class="sprite-area" aria-label="Ashelic Rose character stickers">

                    <img
                    src="assets/ashelic-queen.png"
                    alt="Ashelic Rose queen form"
                    class="artist-sprite artist-sprite--queen"
                    >

                    <img
                    src="assets/ashelic-wounded.png"
                    alt="Ashelic Rose wounded"
                    class="artist-sprite artist-sprite--wounded"
                    >

                    <img
                    src="assets/ashelic-dark.png"
                    alt="Ashelic Rose dark form"
                    class="artist-sprite artist-sprite--dark"
                    >

                    <img
                    src="assets/ashelic-sweet.png"
                    alt="Ashelic Rose sweet form"
                    class="artist-sprite artist-sprite--sweet"
                    >

                    <img
                    src="assets/lollipop.png"
                    alt="Ashelic Rose lollipop"
                    class="artist-sprite artist-sprite--lollipop"
                    >

                    <img
                    src="assets/ash-logo.png"
                    alt="Ashelic Rose logo"
                    class="artist-sprite artist-sprite--logo"
                    >

                </div>

                <div class="player-card">

                    <p class="transmission-label">
                    NOW TRANSMITTING
                    </p>

                    <h1>
                    ASHELIC ROSE
                    </h1>

                    <p class="artist-location">
                    NIGHT COVE // BLOOD FREQUENCY
                    </p>

                    <div class="album-frame">
                    <img
                        src="assets/ashelic-rose-cover.webp"
                        alt="Ashelic Rose song artwork"
                        class="album-art"
                    >
                    </div>

                    <div class="song-info">
                    <h2 id="songTitle">
                        BEY BLADE
                    </h2>

                    <p>
                        ASHELIC ROSE
                    </p>
                    </div>

                    <div class="progress-container">
                    <span id="currentTime">0:00</span>

                    <input
                        id="progressBar"
                        type="range"
                        min="0"
                        max="100"
                        step="0.1"
                        value="0"
                        aria-label="Song progress"
                    >

                    <span id="duration">0:00</span>
                    </div>

                    <div class="controls">
                    <button
                        id="rewindButton"
                        type="button"
                        aria-label="Rewind 10 seconds"
                        title="Rewind 10 seconds"
                    >
                        ←
                    </button>

                    <button
                        id="playButton"
                        class="play-button"
                        type="button"
                        aria-label="Play"
                    >
                        ▶
                    </button>

                    <button
                        id="forwardButton"
                        type="button"
                        aria-label="Forward 10 seconds"
                        title="Forward 10 seconds"
                    >
                        →
                    </button>
                    </div>

                    <div
                    id="equalizer"
                    class="equalizer"
                    aria-hidden="true"
                    >
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    </div>

                    <audio id="audioPlayer" preload="metadata">
                    <source
                        src="assets/ashelic-song.mp3"
                        type="audio/mpeg"
                    >
                    Your browser does not support HTML audio.
                    </audio>

                    <p
                    id="audioStatus"
                    class="audio-status"
                    aria-live="polite"
                    ></p>

                    <div class="artist-actions">
                    <a
                        href="../../bubbles-and-flow/ashelic-rose/index.html"
                        class="secondary-button"
                    >
                        ♥ REPLAY BLOOD RITE
                    </a>

                    <a
                        href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
                        class="ticket-button"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🎟 BUBBLES & FLOW
                    </a>
                    </div>

                </div>

            </section>

            <footer>
                <p>
                    TASTE MY NIGHTMARE // MIDNIGHT ARCADE
                </p>
            </footer>

        </main>

        <script src="ashelic-rose-music.js"></script>

    </body>
</html>
