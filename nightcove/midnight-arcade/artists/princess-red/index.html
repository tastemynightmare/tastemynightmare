<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070713">
    <title>Princess Red | Midnight Arcade</title>
    <link rel="stylesheet" href="princess-red-music.css">
    <link rel="stylesheet" href="../shared/sound-room-accessibility.css">
  </head>

  <body>

    <main class="sound-room">

      <div class="ambient-orbs" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <nav class="sound-nav">
        <a href="../../games.html">
          ← MIDNIGHT ARCADE
        </a>

        <span>
          TMN // ARTIST TRANSMISSION
        </span>
      </nav>

      <section class="artist-stage">

        <div class="sprite-area" aria-label="Princess Red character stickers">

          <img
            src="assets/princess-red-sad.png"
            alt="Princess Red sad"
            class="artist-sprite artist-sprite--sad"
          >

          <img
            src="assets/princess-red-happy.png"
            alt="Princess Red happy"
            class="artist-sprite artist-sprite--happy"
          >

          <img
            src="assets/princess-red-sideeye.png"
            alt="Princess Red side eye"
            class="artist-sprite artist-sprite--sideeye"
          >

          <img
            src="assets/princess-red-performance.png"
            alt="Princess Red performing"
            class="artist-sprite artist-sprite--performance"
          >

          <img
            src="assets/princess-red-logo.png"
            alt="Princess Red logo"
            class="artist-sprite artist-sprite--logo"
          >

          <img
            src="assets/princess-red-sittin.png"
            alt="Princess Red happy"
            class="artist-sprite artist-sprite--sittin"
          >

        </div>

        <div class="player-card">

          <p class="transmission-label">
            NOW TRANSMITTING
          </p>

          <h1>
            PRINCESS RED
          </h1>

          <p class="artist-location">
            CHICAGO // DOLLHOUSE DISTRICT
          </p>

          <div class="album-frame">
            <img
              src="assets/princess-red-flyer.png"
              alt="Princess Red song artwork"
              class="album-art"
            >
          </div>

          <div class="song-info">
            <h2 id="songTitle">
              SAVE ME
            </h2>

            <p>
              PRINCESS RED
            </p>
          </div>

          <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
              id="progressBar"
              type="range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Song progress"
            >

            <span id="duration">0:00</span>
          </div>

          <div class="controls">
            <button
              id="rewindButton"
              type="button"
              aria-label="Rewind 10 seconds"
              title="Rewind 10 seconds"
            >
              ←
            </button>

            <button
              id="playButton"
              class="play-button"
              type="button"
              aria-label="Play"
            >
              ▶
            </button>

            <button
              id="forwardButton"
              type="button"
              aria-label="Forward 10 seconds"
              title="Forward 10 seconds"
            >
              →
            </button>
          </div>

          <div
            id="equalizer"
            class="equalizer"
            aria-hidden="true"
          >
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <audio id="audioPlayer" preload="metadata">
            <source
              src="assets/princess-red-song.mp3"
              type="audio/mpeg"
            >
            Your browser does not support audio playback.
          </audio>

          <p
            id="audioStatus"
            class="audio-status"
            aria-live="polite"
          ></p>

          <div class="artist-actions">
            <a
              href="../../bubbles-and-flow/princess-red/index.html"
              class="secondary-button"
            >
              ♥ REPLAY SAVE ME!
            </a>

            <a
              href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
              class="ticket-button"
              target="_blank"
              rel="noopener noreferrer"
            >
              🎟 BUBBLES & FLOW
            </a>
          </div>

        </div>

      </section>

      <footer>
        <p>
          TASTE MY NIGHTMARE // MIDNIGHT ARCADE
        </p>
      </footer>

    </main>

    <script src="princess-red-music.js"></script>
    <script src="../shared/sound-room-accessibility.js"></script>

  </body>
</html>
