<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Princess Red | Midnight Arcade</title>
        <link rel="stylesheet" href="princess-red-music.css">
    </head>

    <body>

        <main class="sound-room">

            <!-- BACKGROUND DECOR -->

            <div class="stars"></div>

            <!-- NAVIGATION -->

            <nav class="sound-nav">

                <a href="../../games.html">
                    ← MIDNIGHT ARCADE
                </a>

                <span>
                    TMN // ARTIST TRANSMISSION
                </span>

            </nav>

            <!-- MAIN CHARACTER AREA -->

            <section class="artist-stage">

                <!-- PRINCESS RED -->

                <div class="sprite-area">

                    <img
                        src="assets/princess-red-sprite.webp"
                        alt="Princess Red"
                        class="artist-sprite"
                    >

                </div>

                <!-- MUSIC PLAYER -->

                <div class="player-card">

                    <p class="transmission-label">
                        NOW TRANSMITTING
                    </p>

                    <h1>
                        PRINCESS RED
                    </h1>

                    <p class="artist-location">
                        CHICAGO // DOLLHOUSE DISTRICT
                    </p>

                    <!-- ALBUM ART -->

                    <div class="album-frame">

                        <img
                            src="assets/princess-red-cover.webp"
                            alt="Princess Red song artwork"
                            class="album-art"
                        >

                    </div>

                    <!-- SONG INFORMATION -->

                    <div class="song-info">

                        <h2 id="songTitle">
                            SAVE ME
                        </h2>

                        <p>
                            Princess Red
                        </p>

                    </div>

                    <!-- PROGRESS BAR -->

                    <div class="progress-container">

                        <span id="currentTime">
                            0:00
                        </span>

                        <input
                            id="progressBar"
                            type="range"
                            min="0"
                            max="100"
                            value="0"
                        >

                        <span id="duration">
                            1:38
                        </span>

                    </div>

                    <!-- PLAYER CONTROLS -->

                    <div class="controls">

                        <button
                        id="rewindButton"
                        aria-label="Rewind 10 seconds"
                        >
                        ←
                        </button>

                        <button
                        id="playButton"
                        class="play-button"
                        aria-label="Play"
                        >
                        ▶
                        </button>

                        <button
                        id="rewindButton"
                        aria-label="Rewind 10 seconds"
                        >
                        →
                        </button>

                    </div>

                    <!-- CUTE FAKE EQUALIZER -->

                    <div id="equalizer" class="equalizer">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <!-- AUDIO -->
                        <audio id="audioPlayer" preload="metadata">
                            <source
                                src="assets/princess-red-song.mp3"
                                type="audio/mpeg"
                            >
                        </audio>

                    <!-- OTHER LINKS -->

                    <div class="artist-actions">

                        <a
                            href="../../games/princess-red/"
                            class="secondary-button"
                        >
                            ♥ REPLAY SAVE ME!
                        </a>

                        <a
                            href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
                            class="ticket-button"
                            target="_blank"
                        >
                            🎟 BUBBLES & FLOW
                        </a>

                    </div>

                </div>

            </section>

            <footer>

                <p>
                    TASTE MY NIGHTMARE // MIDNIGHT ARCADE
                </p>

            </footer>

        </main>

        <script src="princess-red-music.js"></script>

    </body>

</html>
