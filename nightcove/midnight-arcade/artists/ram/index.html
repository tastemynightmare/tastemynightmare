<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Ram the Pharaoh | Midnight Arcade</title>

        <link rel="stylesheet" href="ram-music.css">
    </head>

    <body>

        <main class="sound-room">

            <div class="stars"></div>

            <nav class="sound-nav">

                <a href="../../games.html">
                    ← MIDNIGHT ARCADE
                </a>

                <span>
                    TMN // ARTIST TRANSMISSION
                </span>

            </nav>

            <section class="artist-stage">

                <div class="sprite-area">

                    <img
                        src="assets/ram-sprite.webp"
                        alt="Ram the Pharaoh"
                        class="artist-sprite"
                    >

                </div>

                <div class="player-card">

                    <p class="transmission-label">
                        NOW TRANSMITTING
                    </p>

                    <h1>
                        RAM THE PHARAOH
                    </h1>

                    <p class="artist-location">
                        JERSEY // PHARAOH FREQUENCY
                    </p>

                    <div class="album-frame">

                        <img
                            src="assets/ram-cover.webp"
                            alt="Ram the Pharaoh song artwork"
                            class="album-art"
                        >

                    </div>

                    <div class="song-info">

                        <h2 id="songTitle">
                            RAM'S FESTIVAL PICK
                        </h2>

                        <p>
                            Ram the Pharaoh
                        </p>

                    </div>

                    <div class="progress-container">

                        <span id="currentTime">
                            0:00
                        </span>

                        <input
                            id="progressBar"
                            type="range"
                            min="0"
                            max="100"
                            value="0"
                        >

                        <span id="duration">
                            0:00
                        </span>

                    </div>

                    <div class="controls">

                        <button
                            id="rewindButton"
                            aria-label="Rewind 10 seconds"
                        >
                            ↶
                        </button>

                        <button
                            id="playButton"
                            class="play-button"
                            aria-label="Play"
                        >
                            ▶
                        </button>

                        <button
                            id="forwardButton"
                            aria-label="Forward 10 seconds"
                        >
                            ↷
                        </button>

                    </div>

                    <div
                        id="equalizer"
                        class="equalizer"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <audio id="audioPlayer" preload="metadata">
                        <source
                            src="assets/ram-song.mp3"
                            type="audio/mpeg"
                        >
                    </audio>

                    <div class="artist-actions">

                        <a
                            href="../../games/ram/"
                            class="secondary-button"
                        >
                            𓂀 REPLAY THE CURSE
                        </a>

                        <a
                            href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
                            class="ticket-button"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🎟 BUBBLES & FLOW
                        </a>

                    </div>

                </div>

            </section>

            <footer>
                <p>
                    TASTE MY NIGHTMARE // MIDNIGHT ARCADE
                </p>
            </footer>

        </main>

        <script src="ram-music.js"></script>

    </body>
</html>
