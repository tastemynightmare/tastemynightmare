<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0a08">

    <title>Ram the Pharaoh | Midnight Arcade</title>

    <link rel="stylesheet" href="ram-music.css">
  </head>

  <body>

    <main class="sound-room">

      <div class="ambient-orbs" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <nav class="sound-nav">
        <a href="../../games.html">
          ← MIDNIGHT ARCADE
        </a>

        <span>
          TMN // ARTIST TRANSMISSION
        </span>
      </nav>

      <section class="artist-stage">

        <div class="sprite-area" aria-label="Ram the Pharaoh character stickers">

          <img
            src="assets/ram-concerned.png"
            alt="Ram the Pharaoh concerned"
            class="artist-sprite artist-sprite--concerned"
          >

          <img
            src="assets/ram-neutral.png"
            alt="Ram the Pharaoh neutral"
            class="artist-sprite artist-sprite--neutral"
          >

          <img
            src="assets/ram-performance.png"
            alt="Ram the Pharaoh performing"
            class="artist-sprite artist-sprite--performance"
          >

          <img
            src="assets/slab-thief.png"
            alt="Slab thief"
            class="artist-sprite artist-sprite--thief"
          >

          <img
            src="assets/slab.png"
            alt="The slab"
            class="artist-sprite artist-sprite--slab"
          >

          <img
            src="assets/ram-logo.png"
            alt="Ram the Pharaoh logo"
            class="artist-sprite artist-sprite--logo"
          >

        </div>

        <div class="player-card">

          <p class="transmission-label">
            NOW TRANSMITTING
          </p>

          <h1>
            RAM THE PHARAOH
          </h1>

          <p class="artist-location">
            JERSEY // PHARAOH FREQUENCY
          </p>

          <div class="album-frame">
            <img
              src="assets/ram-cover.webp"
              alt="Ram the Pharaoh song artwork"
              class="album-art"
            >
          </div>

          <div class="song-info">
            <h2 id="songTitle">
              RAM'S FESTIVAL PICK
            </h2>

            <p>
              RAM THE PHARAOH
            </p>
          </div>

          <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
              id="progressBar"
              type="range"
              min="0"
              max="100"
              step="0.1"
              value="0"
              aria-label="Song progress"
            >

            <span id="duration">0:00</span>
          </div>

          <div class="controls">
            <button
              id="rewindButton"
              type="button"
              aria-label="Rewind 10 seconds"
              title="Rewind 10 seconds"
            >
              ←
            </button>

            <button
              id="playButton"
              class="play-button"
              type="button"
              aria-label="Play"
            >
              ▶
            </button>

            <button
              id="forwardButton"
              type="button"
              aria-label="Forward 10 seconds"
              title="Forward 10 seconds"
            >
              →
            </button>
          </div>

          <div
            id="equalizer"
            class="equalizer"
            aria-hidden="true"
          >
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>

          <audio id="audioPlayer" preload="metadata">
            <source
              src="assets/ram-song.mp3"
              type="audio/mpeg"
            >
            Your browser does not support audio playback.
          </audio>

          <p
            id="audioStatus"
            class="audio-status"
            aria-live="polite"
          ></p>

          <div class="artist-actions">
            <a
              href="../../bubbles-and-flow/ram/index.html"
              class="secondary-button"
            >
              𓂀 REPLAY THE CURSE
            </a>

            <a
              href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
              class="ticket-button"
              target="_blank"
              rel="noopener noreferrer"
            >
              🎟 BUBBLES & FLOW
            </a>
          </div>

        </div>

      </section>

      <footer>
        <p>
          TASTE MY NIGHTMARE // MIDNIGHT ARCADE
        </p>
      </footer>

    </main>

    <script src="ram-music.js"></script>

  </body>
</html>
