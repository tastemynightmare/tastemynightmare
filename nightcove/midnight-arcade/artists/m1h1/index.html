<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>M1H1 | Midnight Arcade</title>
        <link rel="stylesheet" href="m1h1-music.css">
    </head>

    <body>

        <main class="sound-room">

            <div class="ambient-orbs" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav class="sound-nav">

                <a href="../../games.html">
                ← MIDNIGHT ARCADE
                </a>

                <span>
                TMN // ARTIST TRANSMISSION
                </span>

            </nav>

            <section class="artist-stage">

                    <div class="sprite-area">

                        <img
                        src="assets/m1h1-rage.png"
                        alt="M1H1 1"
                        class="artist-sprite"
                        >

                        <img
                        src="assets/m1h1-neutral.png"
                        alt="M1H1 2"
                        class="artist-sprite"
                        >

                        <img
                        src="assets/m1h1-performance.png"
                        alt="M1H1 3"
                        class="artist-sprite"
                        >

                        <img
                        src="assets/zombies.png"
                        alt="M1H1 4"
                        class="artist-sprite"
                        >

                        <img
                        src="assets/m1h1-dope.png"
                        alt="M1H1 5"
                        class="artist-sprite"
                        >

                        <img
                        src="assets/m1h1-logo.png"
                        alt="M1H1 5"
                        class="artist-sprite"
                        >

                    </div>

                    <div class="player-card">

                        <p class="transmission-label">
                            NOW TRANSMITTING
                        </p>

                        <h1>
                            M1H1
                        </h1>

                        <p class="artist-location">
                            NEVERENDING MOSHPIT // RAGE FREQUENCY
                        </p>

                        <div class="album-frame">

                        <img
                        src="assets/m1h1-cover.webp"
                        alt="M1H1 song artwork"
                        class="album-art"
                        >

                    </div>

                    <div class="song-info">

                        <h2 id="songTitle">
                            710
                        </h2>

                        <p>
                            M1H1
                        </p>

                    </div>

                    <div class="progress-container">

                        <span id="currentTime">
                        0:00
                        </span>

                        <input
                        id="progressBar"
                        type="range"
                        min="0"
                        max="100"
                        value="2:26"
                        aria-label="Song progress"
                        >

                        <span id="duration">
                        2:26
                        </span>

                    </div>

                    <div class="controls">

                        <button
                        id="rewindButton"
                        aria-label="Rewind 10 seconds"
                        >
                        ←
                        </button>

                        <button
                        id="playButton"
                        class="play-button"
                        aria-label="Play"
                        >
                        ▶
                        </button>


                        <button
                        id="rewindButton"
                        aria-label="Rewind 10 seconds"
                        >
                        →
                        </button>

                    </div>

                    <div
                        id="equalizer"
                        class="equalizer"
                        aria-hidden="true"
                        >
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <audio id="audioPlayer" preload="metadata">
                    <source
                    src="assets/m1h1-song.mp3"
                    type="audio/mpeg"
                    >
                    Your browser does not support audio playback.
                    </audio>

                    <p id="audioStatus" class="audio-status" aria-live="polite"></p>

                    <div class="artist-actions">

                        <a
                        href="../../bubbles-and-flow/m1h1/index.html"
                        class="secondary-button"
                        >
                        ⚡ REPLAY RAGE FOREVER
                        </a>

                        <a
                        href="https://shotgun.live/en/festivals/bubbles-flow-music-festival"
                        class="ticket-button"
                        target="_blank"
                        rel="noopener noreferrer"
                        >
                        🎟 BUBBLES & FLOW
                        </a>

                    </div>

                </div>

            </section>

            <footer>
                <p>
                TASTE MY NIGHTMARE // MIDNIGHT ARCADE
                </p>
            </footer>

        </main>

        <script src="m1h1-music.js"></script>

    </body>
</html>
